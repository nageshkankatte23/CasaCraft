
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CasaCraft | Interior Design</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header>

        <nav class="navbar">

            <div class="logo">
                Casa<span>Craft</span>
            </div>

            <ul class="nav-links" id="navLinks">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <div class="nav-buttons">

                <button id="darkMode">🌙</button>

                <button class="menu-btn" id="menuBtn">
                    ☰
                </button>

            </div>

        </nav>

    </header>




    <!-- CONTACT -->

    <section class="contact" id="contact">

        <div class="contact-content">

            <div>

                <p class="subtitle">
                    GET IN TOUCH
                </p>

                <h2>
                    Let's Create Your
                    Dream Space.
                </h2>

                <p>
                    Tell us about your project and our design
                    team will get back to you.
                </p>

            </div>


            <form id="contactForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    required>

                <input
                    type="email"
                    id="email"
                    placeholder="Your Email"
                    required>

                <select id="service" required>

                    <option value="">
                        Select Service
                    </option>

                    <option>
                        Home Interior
                    </option>

                    <option>
                        Office Design
                    </option>

                    <option>
                        Custom Design
                    </option>

                    <option>
                        Lighting Design
                    </option>

                </select>

                <textarea
                    id="message"
                    placeholder="Tell us about your project"
                    required></textarea>

                <button class="primary-btn" type="submit">
                    Send Inquiry
                </button>

            </form>

        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        <div class="logo">
            Casa<span>Craft</span>
        </div>

        <p>
            Designing beautiful spaces for beautiful lives.
        </p>

        <p class="copyright">
            ©️ 2026 CasaCraft. All Rights Reserved.
        </p>

    </footer>


    <script src="1.js"></script>


</body>

</html>
